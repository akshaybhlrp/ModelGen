[package]
name = "modelgen"
version = "0.1.0"
edition = "2021"

[dependencies]
redb = "2.1"
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
tempfile = "3.10"
reqwest = { version = "0.12", features = ["json", "blocking"] }
sha2 = "0.10"
